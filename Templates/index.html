<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Sistema de Equipamentos</title>

</head>

<body>

    <div id="login">

        <h2>Login do Sistema</h2>

        <input
            type="email"
            id="email"
            placeholder="E-mail">

        <input
            type="password"
            id="senha"
            placeholder="Senha">

        <button onclick="login()">
            Entrar
        </button>

        <a href="/cadastro" class="link-cadastro">
            Fazer cadastro
        </a>

        <p id="mensagem"></p>

    </div>


    <div id="principal">

        <h1>Sistema de Equipamentos</h1>

        <p class="usuario">
            Bem-vindo,
            <strong id="nomeUsuario"></strong>
        </p>

        <div class="menu">

            <button onclick="cadastro()">
                Cadastro de Equipamentos
            </button>

            <button onclick="gestao()">
                Gestão de Equipamentos
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
